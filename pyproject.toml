[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actioncloud"
version = "0.4.0"
description = "Governed adaptive experience memory for AI agent fleets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "psycopg[binary,pool]==3.2.3",
  "boto3==1.35.81",
  "python-dotenv==1.0.1",
  "httpx==0.28.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"actioncloud.benchmark" = ["*.json"]

[project.scripts]
actioncloud-mcp = "actioncloud.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
